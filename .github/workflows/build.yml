name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Diagnostic - SDK discovery
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "=== searching for SDK ==="
          for d in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk; do
            if [ -d "$d" ]; then
              echo "FOUND: $d"
              ls -la "$d"
            fi
          done
          gradle --version

      - name: Write local.properties
        run: |
          SDK=""
          for d in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk; do
            if [ -d "$d" ] && [ -d "$d/platforms" ]; then SDK="$d"; break; fi
          done
          if [ -z "$SDK" ]; then
            for d in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk; do
              if [ -d "$d" ]; then SDK="$d"; break; fi
            done
          fi
          echo "Using SDK: $SDK"
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: List outputs
        if: always()
        run: |
          echo "=== outputs ==="
          find app/build/outputs -type f 2>/dev/null || echo "no outputs dir"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gsz-loader-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
